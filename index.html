      ${(t.addresses||[]).length===0 ? `<div style="font-size:12px;color:var(--ink-soft);">Ninguna todavía. Usa "Agregar dirección" en el mapa.</div>` :
      (t.addresses||[]).map(a=>`
        <div class="addr-row">
          <span class="a-txt">${escapeHtml(a.address)} <span class="a-count">${a.notAtHome?('· No en casa: '+a.notAtHome):''}</span></span>
          <span style="display:flex;gap:4px;">
            <button class="btn small secondary" data-nah="${a.id}" title="+1 No en casa">+NC</button>
            <button class="btn small danger" data-deladdr="${a.id}">✕</button>
          </span>
        </div>`).join('')}

      <div style="margin-top:14px;display:flex;gap:8px;">

        <button class="btn small danger" id="deleteTerrBtn">Eliminar territorio</button>
      </div>
    </div>

  if(assignedPub){

      if(!t.history) t.history=[];

      showToast('Territorio marcado como devuelto');
    };
  } else {
    document.getElementById('assignTerrBtn').onclick = ()=>{
      const pid = document.getElementById('assignPubSel').value;
      if(!pid){ showToast('Elige un publicador'); return; }
      t.assignment = { publisherId: pid, dateOut: todayStr() };

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }

function openNewTerritoryModal(){
  const usedColors = DATA.territories.map(t=>t.color);
  const suggested = TERR_COLORS.find(c=>!usedColors.includes(c)) || TERR_COLORS[0];
  showModal(`
    <h3>Nuevo territorio</h3>
    <div class="grid2"><div class="field"><label>Número</label><input type="text" id="ntNum" placeholder="Ej. 12"></div><div class="field"><label>Nombre</label><input type="text" id="ntName" placeholder="Ej. Centro"></div></div>
    <div class="field"><label>Grupo de Predicación</label><select id="ntGroup"><option value="">Sin grupo</option>${(DATA.preachingGroups||[]).map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('')}</select></div><div class="field"><label>Etapas del territorio</label><textarea id="ntStages" rows="2" placeholder="Una etapa por línea. Si no tiene etapas, deje General.">General</textarea></div><div class="field"><label>Notas</label><textarea id="ntNotes" rows="2" placeholder="Ej. Edificio con portero, tocar solo en horas de la tarde..."></textarea></div>
    <div class="field"><label>Color</label><div class="colorpicker" id="ntColors">${TERR_COLORS.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===suggested?'sel':''}"></span>`).join('')}</div></div>
    <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="ntSave">Crear</button></div>
  `);
  let chosen = suggested;
  document.getElementById('ntColors').addEventListener('click', e=>{
    const sw = e.target.closest('span[data-c]'); if(!sw) return;
    chosen = sw.dataset.c;
    document.querySelectorAll('#ntColors span').forEach(s=>s.classList.toggle('sel', s===sw));
  });
  document.getElementById('ntSave').onclick = ()=>{
    const number = document.getElementById('ntNum').value.trim();
    const name = document.getElementById('ntName').value.trim();
    if(!number || !name){ showToast('Escribe número y nombre'); return; }
    const stages=document.getElementById('ntStages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean); const t = { id: uid('t'), number, name, color: chosen, notes: document.getElementById('ntNotes').value.trim(), preachingGroupId: document.getElementById('ntGroup').value, stages: stages.length?stages:['General'], boundary: null, addresses: [], assignment: null, history: [] };
    DATA.territories.push(t);
    saveData(); closeModal(); showToast('Territorio creado');
    SELECTED_TERR = t.id;
    renderTerritories(document.getElementById('content'), document.getElementById('topbarActions'));
  };
}

/* --- dibujo de límites y direcciones sobre el mapa --- */
let ACTIVE_DRAW_HANDLER = null;
function startDraw(type){
  if(!SELECTED_TERR || !MAP) return;
  cancelDraw();
  DRAW_MODE = { territoryId: SELECTED_TERR, type };
  document.getElementById('cancelDrawBtn').style.display = '';
  if(type==='boundary'){
    ACTIVE_DRAW_HANDLER = new L.Draw.Polygon(MAP, { shapeOptions: { color: DATA.territories.find(t=>t.id===SELECTED_TERR).color } });
  } else {
    ACTIVE_DRAW_HANDLER = new L.Draw.Marker(MAP);
  }
  ACTIVE_DRAW_HANDLER.enable();
  showToast(type==='boundary' ? 'Dibuja el límite: clic para cada punto, doble clic para terminar' : 'Haz clic en el mapa donde está la dirección');
}
function cancelDraw(){
  if(ACTIVE_DRAW_HANDLER){ try{ ACTIVE_DRAW_HANDLER.disable(); }catch(e){} ACTIVE_DRAW_HANDLER = null; }
  DRAW_MODE = null;
  const btn = document.getElementById('cancelDrawBtn'); if(btn) btn.style.display = 'none';
}
document.addEventListener('DOMContentLoaded', ()=>{
  // El listener global de dibujo se registra una vez que el mapa exista (delegado vía window, ver abajo)
});
// Leaflet.draw dispara este evento en el mapa cuando se crea una geometría.
function bindDrawCreated(){
  MAP.off(L.Draw.Event.CREATED);
  MAP.on(L.Draw.Event.CREATED, (e)=>{
    if(!DRAW_MODE) return;
    const t = DATA.territories.find(x=>x.id===DRAW_MODE.territoryId);
    if(!t){ cancelDraw(); return; }
    if(DRAW_MODE.type==='boundary'){
      const latlngs = e.layer.getLatLngs()[0].map(ll=>[ll.lat, ll.lng]);
      t.boundary = latlngs;
      saveData(); cancelDraw(); renderTerritoryLayers(); showToast('Límite guardado');
    } else {
      const ll = e.layer.getLatLng();
      showModal(`
        <h3>Nueva dirección</h3>
        <div class="field"><label>Villa</label><input type="text" id="addrTxt" placeholder="Ej. Calle 5 #12-34"></div>
        <div class="actions"><button class="btn secondary" id="addrCancel">Cancelar</button><button class="btn" id="addrSave">Guardar</button></div>
      `);
      document.getElementById('addrCancel').onclick = ()=>{ closeModal(); cancelDraw(); };
      document.getElementById('addrSave').onclick = ()=>{
        const txt = document.getElementById('addrTxt').value.trim();
        if(!t.addresses) t.addresses = [];
        t.addresses.push({ id: uid('a'), lat: ll.lat, lng: ll.lng, address: txt || 'Sin nombre', notAtHome:0 });
        saveData(); closeModal(); cancelDraw(); renderTerritoryLayers(); renderTerrDetail();
        showToast('Dirección agregada');
      };
    }
  });
}

/* engancha bindDrawCreated cada vez que se crea un mapa nuevo */
const _origInitMap = initMap;
initMap = function(){ _origInitMap(); if(MAP) bindDrawCreated(); };

function serviceYearOptions(selected){
  const now=currentServiceYear(); const ys=[]; for(let y=now-3;y<=now+2;y++) ys.push(y);
  return ys.map(y=>`<option value="${y}" ${y===selected?'selected':''}>${y}</option>`).join('');
}
function getTerrStages(t){ return (t.stages&&t.stages.length?t.stages:['General']); }
function assignmentRowsFor(t,stage,year){
  if(!DATA.territoryAssignments) DATA.territoryAssignments=[];
  return DATA.territoryAssignments.filter(r=>r.territoryId===t.id&&r.stage===stage&&Number(r.serviceYear)===Number(year)).sort((a,b)=>(a.sequence||0)-(b.sequence||0));
}
function lastCompletion(rows){
  const dates=rows.flatMap(r=>(r.assignments||[]).map(a=>a.completed)).filter(Boolean).sort();
  return dates.length?dates[dates.length-1]:'';
}
function renderTerritoryRegister(content,actions){
  const state=window.TERR_REG_STATE||{year:currentServiceYear(),group:'',territory:'',stage:''}; window.TERR_REG_STATE=state;
  const groups=[...(DATA.preachingGroups||[])];
  const terrs=[...DATA.territories].sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
  if(!state.group && terrs[0]?.preachingGroupId) state.group=terrs[0].preachingGroupId;
  const group=groups.find(g=>g.id===state.group)||groups[0];
  if(group) state.group=group.id;
  const groupTerrs=group?terrs.filter(t=>t.preachingGroupId===group.id):terrs;
  const selected=groupTerrs.find(t=>t.id===state.territory)||groupTerrs[0]||terrs.find(t=>t.id===state.territory)||terrs[0];
  if(selected) state.territory=selected.id;

  let stageNames=[];
  if(group){
    const cfg=group.stageConfig||{};
    const count=Math.max(0,Number(cfg.count)||0);
    const custom=Array.isArray(group.customStages)?group.customStages:[];
    const legacy=Array.isArray(group.stages)?group.stages.map(x=>typeof x==='string'?x:x.name):[];
    for(let i=0;i<Math.max(count,custom.length,legacy.length);i++) stageNames.push(custom[i]||legacy[i]||`Etapa ${i+1}`);
  }
  if(!stageNames.length && selected) stageNames=getTerrStages(selected);
  if(selected && (!state.stage||!stageNames.includes(state.stage))) state.stage=stageNames[0]||'General';
  const idx=Math.max(0,stageNames.indexOf(state.stage));
  const blockCount=Math.max(0,Number(group?.stageConfig?.blocks?.[idx])||0);

  actions.innerHTML=`
    <select id="trYear">${serviceYearOptions(state.year)}</select>
    <select id="trGroup"><option value="">Seleccionar grupo...</option>${groups.map(g=>`<option value="${g.id}" ${g.id===state.group?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}</select>
    <select id="trTerr"><option value="">Seleccionar territorio...</option>${groupTerrs.map(t=>`<option value="${t.id}" ${t.id===state.territory?'selected':''}>#${escapeHtml(t.number)} ${escapeHtml(t.name)}</option>`).join('')}</select>
    <select id="trStage">${stageNames.map(x=>`<option ${x===state.stage?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select>
    <button class="btn secondary" id="trConfig">Configurar etapas y manzanas</button>
    <button class="btn secondary" id="trPrint">Imprimir / PDF</button>`;

  let rows=assignmentRowsFor(selected||{id:''},state.stage,state.year);
  const needed=Math.max(blockCount,rows.length,0);
  if(selected && rows.length<needed){
    for(let i=rows.length;i<needed;i++) DATA.territoryAssignments.push({id:uid('ta'),territoryId:selected.id,stage:state.stage,serviceYear:Number(state.year),sequence:i+1,manzana:String(i+1),assignments:[{},{},{}]});
    saveData(); rows=assignmentRowsFor(selected,state.stage,state.year);
  }

  content.innerHTML=`<div class="card territory-register">
    <div class="s13-title">REGISTRO DE ASIGNACIÓN DE TERRITORIO</div>
    <div class="s13-year"><strong>Año de servicio:</strong> ${state.year} ${selected?`<span style="float:right"><strong>Etapa:</strong> ${escapeHtml(state.stage)}</span>`:''}</div>
    <div class="s13-sub">${selected?`<strong>Núm. de terr.:</strong> #${escapeHtml(selected.number)} &nbsp; <strong>Grupo:</strong> ${escapeHtml(group?.name||'—')} &nbsp; <strong>Territorio:</strong> ${escapeHtml(selected.name||'')} &nbsp; <strong>Manzanas:</strong> ${blockCount||rows.length||0}`:'Selecciona un grupo y territorio.'}</div>
    <div class="s13-scroll"><table class="s13-table"><thead>
      <tr><th rowspan="2">Núm.<br>de manzana</th><th rowspan="2">Última fecha<br>en que se<br>completó*</th><th colspan="2">Asignado a</th><th colspan="2">Asignado a</th><th colspan="2">Asignado a</th></tr>
      <tr><th>Fecha en que se asignó</th><th>Fecha en que se completó</th><th>Fecha en que se asignó</th><th>Fecha en que se completó</th><th>Fecha en que se asignó</th><th>Fecha en que se completó</th></tr>
    </thead><tbody>${selected?renderAssignmentRows(selected,state.stage,state.year):'<tr><td colspan="8">Selecciona un territorio.</td></tr>'}</tbody></table></div>
    <div class="s13-foot">* La última fecha se calcula automáticamente con la fecha de completado más reciente de los tres asignados. El número de manzana se puede editar.</div>
  </div>`;

  document.getElementById('trYear').onchange=e=>{state.year=Number(e.target.value);renderTerritoryRegister(content,actions)};
  document.getElementById('trGroup').onchange=e=>{state.group=e.target.value;state.territory='';state.stage='';renderTerritoryRegister(content,actions)};
  document.getElementById('trTerr').onchange=e=>{state.territory=e.target.value;state.stage='';renderTerritoryRegister(content,actions)};
  document.getElementById('trStage').onchange=e=>{state.stage=e.target.value;renderTerritoryRegister(content,actions)};
  document.getElementById('trPrint').onclick=()=>window.print();
  document.getElementById('trConfig').onclick=()=>openTerritoryStageConfig(group,state.stage,()=>renderTerritoryRegister(content,actions));
  content.querySelectorAll('[data-tr]').forEach(el=>el.onchange=()=>saveAssignmentCell(el,selected,state.stage,state.year));
  content.querySelectorAll('[data-tradd]').forEach(btn=>btn.onclick=()=>addAssignmentRow(selected,state.stage,state.year));
}

function openTerritoryStageConfig(group,currentStage,rerender){
  if(!group){showToast('Primero selecciona un grupo');return;}
  const count=Math.max(1,Number(group.stageConfig?.count)||Math.max(1,(group.customStages||[]).length));
  const blocks=group.stageConfig?.blocks||[];
  const existing=[...(group.customStages||[]),...(group.stages||[]).map(x=>typeof x==='string'?x:x.name)];
  const makeRows=(n,names,nums)=>Array.from({length:n},(_,i)=>`<div class="grid2" style="margin-bottom:8px"><div class="field"><label>Etapa ${i+1}</label><input id="stageName${i}" value="${escapeAttr(names[i]||`Etapa ${i+1}`)}"></div><div class="field"><label>Número de manzanas</label><input type="number" min="0" id="stageBlocks${i}" value="${Number(nums[i]||0)}"></div></div>`).join('');
  showModal(`<h3>Configurar etapas y manzanas — ${escapeHtml(group.name)}</h3><div class="field"><label>Número de etapas que tiene el grupo</label><input type="number" id="stageCount" min="1" max="99" value="${count}"></div><div id="stageConfigRows">${makeRows(count,existing,blocks)}</div><p class="note">Ejemplo: si el grupo tiene 2 etapas, define Etapa 1 y Etapa 2 y la cantidad de manzanas de cada una. Al aumentar la cantidad se crean nuevas filas. Al reducirla no se borran registros anteriores.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="saveStageConfig">Guardar configuración</button></div>`);
  const redraw=()=>{const n=Math.max(1,Number(document.getElementById('stageCount').value)||1);const names=Array.from(document.querySelectorAll('[id^="stageName"]')).map(x=>x.value);const nums=Array.from(document.querySelectorAll('[id^="stageBlocks"]')).map(x=>x.value);document.getElementById('stageConfigRows').innerHTML=makeRows(n,names,nums)};
  document.getElementById('stageCount').oninput=redraw;
  document.getElementById('saveStageConfig').onclick=()=>{const n=Math.max(1,Number(document.getElementById('stageCount').value)||1);const names=Array.from({length:n},(_,i)=>document.getElementById('stageName'+i).value.trim()||`Etapa ${i+1}`);const nums=Array.from({length:n},(_,i)=>Math.max(0,Number(document.getElementById('stageBlocks'+i).value)||0));group.stageConfig={count:n,blocks:nums};group.customStages=names;saveData();closeModal();rerender();showToast('Etapas y manzanas actualizadas')};
}

function renderAssignmentRows(t,stage,year){
  let rows=assignmentRowsFor(t,stage,year);
  if(!rows.length) rows=[{id:'new',sequence:1,manzana:'1',assignments:[{},{},{}]}];
  const rowHtml=rows.map((r)=>`<tr>
    <td><input data-tr="manzana" data-row="${r.id}" value="${escapeAttr(r.manzana||'')}" placeholder="1"></td>
    <td>${escapeHtml(lastCompletion([r])||'—')}</td>

  </tr>`).join('');

function ensureAssignmentRow(t,stage,year,id){
  if(READONLY) return {id:'ro',territoryId:t.id,stage,serviceYear:Number(year),sequence:1,manzana:'1',assignments:[{},{},{}]};
  if(!DATA.territoryAssignments) DATA.territoryAssignments=[];
  if(id){const found=DATA.territoryAssignments.find(x=>x.id===id);if(found)return found;}
  const existing=DATA.territoryAssignments.filter(x=>x.territoryId===t.id&&x.stage===stage&&Number(x.serviceYear)===Number(year));
  const r={id:uid('ta'),territoryId:t.id,stage,serviceYear:Number(year),sequence:existing.length+1,manzana:String(existing.length+1),assignments:[{},{},{}]};DATA.territoryAssignments.push(r);return r;
}
function saveAssignmentCell(el,t,stage,year){
  const r=ensureAssignmentRow(t,stage,year,el.dataset.row==='new'?null:el.dataset.row);if(el.dataset.tr==='manzana')r.manzana=el.value.trim();else{const j=Number(el.dataset.j);r.assignments=r.assignments||[{},{},{}];r.assignments[j]=r.assignments[j]||{};r.assignments[j][el.dataset.tr]=el.value}saveData();renderTerritoryRegister(document.getElementById('content'),document.getElementById('topbarActions'));showToast('Asignación guardada')

function durationSince(dateStr){
  if(!dateStr)return {years:'—',months:'—'};const start=new Date(dateStr+'T00:00:00'),now=new Date();if(isNaN(start))return {years:'—',months:'—'};
  let y=now.getFullYear()-start.getFullYear(),m=now.getMonth()-start.getMonth();if(now.getDate()<start.getDate())m--;if(m<0){y--;m+=12}return {years:Math.max(0,y),months:Math.max(0,m)};
}
function groupStageNames(group){
  if(!group)return ['General'];const c=group.stageConfig||{},n=Math.max(Number(c.count)||0,(group.customStages||[]).length,(group.stages||[]).length);if(!n)return ['General'];return Array.from({length:n},(_,i)=>(group.customStages||[])[i]||((group.stages||[])[i]&&((group.stages||[])[i].name||group.stages[i]))||`Etapa ${i+1}`);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `respaldo_congregacion_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url); showToast('Respaldo descargado');
}
function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed || !Array.isArray(parsed.publishers)){ showToast('⚠ El archivo no tiene un formato válido'); return; }
      showModal(`<h3>Cargar respaldo</h3><p>El archivo contiene <strong>${parsed.publishers.length}</strong> publicador(es) y <strong>${(parsed.territories||[]).length}</strong> territorio(s) de "<strong>${escapeHtml(parsed.congregation||'')}</strong>". Esto reemplazará la información actual.</p>
        <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="confirmImport">Restaurar respaldo</button></div>`);
      document.getElementById('confirmImport').onclick = ()=>{
        DATA = parsed;
        if(DATA.congregation==='Mi Congregación') DATA.congregation='Congregación Joya Oeste';
        if(!DATA.meetingAttendance) DATA.meetingAttendance = {};
        if(!DATA.territories) DATA.territories = [];
         if(!DATA.preachingGroups) DATA.preachingGroups=[];
         if(!DATA.meetingSettings) DATA.meetingSettings={weekendDay:'Sábado',midweekDay:'Miércoles'};
        if(!DATA.mapCenter) DATA.mapCenter = defaultData().mapCenter;
        saveData(); closeModal(); showToast('Respaldo restaurado'); setView('panel');
      };
    }catch(err){ showToast('⚠ No se pudo leer el archivo'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

  const r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):Array.from({length:n},()=>Math.floor(Math.random()*256));

/* ---------- sincronización compartida (datos de la congregación) ---------- */
function setSyncBadge(t){ const b=$id('syncBadge'); if(b) b.textContent=t; }
function syncSoon(){
  if(!SYNC.db||!SYNC.enabled||!SYNC.canWrite||READONLY) return;
  clearTimeout(SYNC.t); setSyncBadge('☁ Guardando…');
  SYNC.t=setTimeout(()=>{SYNC.t=null;syncPush();},900);
}
async function syncPush(){
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true;
  try{
    const whole=JSON.parse(safeSerializeData()), want={};
    Object.keys(whole).forEach(k=>{
      const s=JSON.stringify(whole[k]===undefined?null:whole[k]);
      const n=Math.max(1,Math.ceil(s.length/CHUNK));
      for(let i=0;i<n;i++) want[k+'-'+i]={name:k,i,n,json:s.slice(i*CHUNK,(i+1)*CHUNK)};
    });
    const col=SYNC.db.collection('chunks');
    for(const id of Object.keys(want)){
      if(SYNC.last[id]!==want[id].json){
        try{ await col.doc(id).set(want[id]); SYNC.last[id]=want[id].json; }
        catch(e){ if(e&&e.code==='permission-denied'){ SYNC.denied=true; continue; } throw e; }
      }
    }
    for(const id of Object.keys(SYNC.last)){
      if(!want[id]){
        try{ await col.doc(id).delete(); delete SYNC.last[id]; }
        catch(e){ if(e&&e.code==='permission-denied'){ SYNC.denied=true; continue; } throw e; }
      }
    }
    setSyncBadge('☁ Sincronizado');
  }catch(e){ console.error(e); setSyncBadge('⚠ Error al sincronizar'); showToast('⚠ No se pudo guardar en la nube'); }
  SYNC.busy=false;
  if(SYNC.again){ SYNC.again=false; syncPush(); }
}
function applyRemote(docs){
  const g={}, last={};
  docs.forEach(d=>{ const x=d.data(); if(!x) return; last[d.id]=x.json; (g[x.name]=g[x.name]||[]).push(x); });
  const out={};
  Object.keys(g).forEach(k=>{ const p=g[k].sort((a,b)=>a.i-b.i); if(p.length!==p[0].n) return; try{ out[k]=JSON.parse(p.map(x=>x.json).join('')); }catch(e){} });
  if(!Object.keys(out).length) return false;
  DATA=normalizeData(Object.assign(defaultData(),out)); SYNC.last=last;
  if(isLector()) deepFreeze(DATA);
  return true;
}
function remoteChanged(docs){
  const ids=new Set(docs.map(d=>d.id));
  return docs.some(d=>{const x=d.data();return x&&SYNC.last[d.id]!==x.json;}) || Object.keys(SYNC.last).some(id=>!ids.has(id));
}
function watchRemote(){
  if(!SYNC.db||SYNC.watching) return; SYNC.watching=true;
  const col=SYNC.db.collection('chunks');
  col.onSnapshot(snap=>{
    if(!remoteChanged(snap.docs)) return;
    clearTimeout(SYNC.rt);
    const attempt=async()=>{
      const a=document.activeElement, typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
      if(!READONLY&&(SYNC.t||SYNC.busy||typing)){ SYNC.rt=setTimeout(attempt,3000); return; }
      try{ const fresh=await col.get(); if(remoteChanged(fresh.docs)&&applyRemote(fresh.docs)){ render(); showToast('Datos actualizados'); } }catch(e){}
    };
    SYNC.rt=setTimeout(attempt,700);
  },()=>{});
}
function deepFreeze(o){ if(o&&typeof o==='object'&&!Object.isFrozen(o)){ Object.freeze(o); Object.keys(o).forEach(k=>deepFreeze(o[k])); } return o; }

async function startAuth(){

async function resolveSession(fbUser){

  let role=null,name=null,active=true,modules=null;
  if(ADMIN_EMAILS.includes(email)){ role='admin'; name='Administrador'; }
  else{

    }catch(e){}
  }
  if(!role||!active){ setLoginMsg('Esta cuenta no tiene acceso a la aplicación.',true); enableLogin(true); try{ await firebase.auth().signOut(); }catch(e){} return; }
  SYNC.db=firebase.firestore(); SYNC.canWrite=true;
  await enterApp({id:email,name:name||email,username:email,role,modules});
}

  if(!isLector()&&FIREBASE_READY) $id('ubPw').onclick=()=>openChangePw();
  $id('ubOut').onclick=async()=>{ try{ if(FIREBASE_READY) await firebase.auth().signOut(); }catch(e){} location.reload(); };
  if(SYNC.db) $id('sideFoot').textContent='Los datos se guardan en la nube y se comparten con los demás usuarios.';
}
function openChangePw(){
  showModal(`<h3>Cambiar contraseña</h3>
  <div class="field"><label>Contraseña actual</label><input type="password" id="cpOld"></div>
  <div class="field"><label>Nueva contraseña (mínimo 6 caracteres)</label><input type="password" id="cpNew"></div>
  <div class="field"><label>Repite la nueva contraseña</label><input type="password" id="cpNew2"></div>
  <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="cpSave">Guardar</button></div>`);
  $id('cpSave').onclick=async()=>{
    const o=$id('cpOld').value,n=$id('cpNew').value,n2=$id('cpNew2').value;
    if(n.length<6){ showToast('La nueva contraseña es muy corta'); return; }
    if(n!==n2){ showToast('Las contraseñas no coinciden'); return; }
    try{
      const user=firebase.auth().currentUser;
      const cred=firebase.auth.EmailAuthProvider.credential(user.email,o);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(n);
      closeModal(); showToast('Contraseña actualizada');
    }catch(e){ showToast('La contraseña actual no es correcta.'); }
  };
}

/* ---------- vista: usuarios y accesos (solo administradores) ---------- */
function renderUsers(content,actions){
  actions.innerHTML='<button class="btn" id="newUserBtn">+ Nuevo usuario</button>';
  $id('newUserBtn').onclick=()=>openUserModal();
  const cnt=r=>USERS.filter(u=>u.role===r).length;
  const order={admin:0,colab:1,lector:2};
  const rows=[...USERS].sort((a,b)=>order[a.role]-order[b.role]||a.name.localeCompare(b.name));
  content.innerHTML=`
    <div class="note"><strong>Administradores</strong>: acceso total y gestión de usuarios (se definen en el código, no aquí). <strong>Colaboradores</strong>: registran y editan solo los módulos que se les asignen (Secretaría, Territorios, Discursos Públicos, Predicación Pública); el resto lo ven en modo lectura. Pueden descargar el respaldo pero no cargarlo, y no ven esta sección. <strong>Lectores</strong>: solo visualizan; no pueden editar, importar/exportar ni imprimir.</div>
    <div class="stat-row"><div class="stat"><div class="num">${cnt('admin')}/${ROLE_CAP.admin}</div><div class="lbl">Administradores</div></div><div class="stat"><div class="num">${cnt('colab')}/${ROLE_CAP.colab}</div><div class="lbl">Colaboradores</div></div><div class="stat"><div class="num">${cnt('lector')}</div><div class="lbl">Lectores</div></div></div>
    <div class="card"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Módulos que edita</th><th>Estado</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr>
      <td>${escapeHtml(u.name)}${u.id===CUR.id?' <small>(tú)</small>':''}</td><td>${escapeHtml(u.username)}</td>
      <td><span class="badge role-${u.role}">${ROLE_LABEL[u.role]}</span></td>
      <td>${modsSummary(u)}</td>
      <td><span class="badge ${u.active===false?'Inactivo':'Activo'}">${u.active===false?'Desactivado':'Activo'}</span></td>
      <td style="white-space:nowrap;text-align:right">${u.role==='admin'?'<small>Definido en el código</small>':`${u.role==='colab'?`<button class="btn small" data-u="mod" data-id="${u.id}">Módulos</button> `:''}<button class="btn small secondary" data-u="reset" data-id="${u.id}">Restablecer contraseña</button> <button class="btn small secondary" data-u="tog" data-id="${u.id}">${u.active===false?'Activar':'Desactivar'}</button> <button class="btn small danger" data-u="del" data-id="${u.id}">Quitar acceso</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  content.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>userAction(b.dataset.u,USERS.find(x=>x.id===b.dataset.id)));
}
function roleOptions(current){
  return ['lector','colab'].map(r=>{
    const used=USERS.filter(u=>u.role===r).length;
    const full=ROLE_CAP[r]!==undefined&&used>=ROLE_CAP[r];
    return `<option value="${r}" ${r===current?'selected':''} ${full?'disabled':''}>${ROLE_LABEL[r]}${full?' (cupo lleno)':''}</option>`;
  }).join('');
}
function openUserModal(){
  showModal(`<h3>Nuevo usuario</h3>
  <div class="field"><label>Nombre completo</label><input id="uName"></div>
  <div class="grid2"><div class="field"><label>Correo electrónico</label><input id="uUser" type="email" autocapitalize="none"></div>
  <div class="field"><label>Rol</label><select id="uRole">${roleOptions('lector')}</select></div></div>
  <div class="field" id="uModsWrap" style="display:none"><label>Módulos que puede editar (el resto lo verá en modo lectura)</label>${modsChecks(null)}</div>
  <div class="field"><label>Contraseña temporal</label><input id="uPw" value="${randStr(8)}"></div>
  <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="uSave">Guardar</button></div>`);
  const syncModsBox=()=>{ $id('uModsWrap').style.display=($id('uRole').value==='colab')?'':'none'; };
  $id('uRole').addEventListener('change',syncModsBox); syncModsBox();
  $id('uSave').onclick=async()=>{
    const name=$id('uName').value.trim(), role=$id('uRole').value, email=$id('uUser').value.trim().toLowerCase(), pw=$id('uPw').value;
    const rec={name,role,active:true}; if(role==='colab') rec.modules=readMods($id('uModsWrap'));
    if(!name||!email){ showToast('Escribe el nombre y el correo'); return; }
    if(pw.length<6){ showToast('La contraseña debe tener al menos 6 caracteres'); return; }
    if(ADMIN_EMAILS.includes(email)||USERS.some(x=>x.id===email)){ showToast('Ese correo ya tiene acceso'); return; }
    try{
      const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebaseConfig,'sec');
      await sec.auth().createUserWithEmailAndPassword(email,pw);
      await sec.auth().signOut();
      await firebase.firestore().collection('usuarios').doc(email).set(rec);
      showCreds([{n:name,u:email,pw}],'Usuario creado'); USERS=await loadRoster(); render();
    }catch(e){
      if(e.code==='auth/email-already-in-use'){
        try{ await firebase.firestore().collection('usuarios').doc(email).set(rec); USERS=await loadRoster(); render(); closeModal(); showToast('Ese correo ya tenía cuenta; se habilitó con este rol.'); }
        catch(e2){ showToast('No se pudo habilitar el usuario.'); }
      } else { showToast('No se pudo crear el usuario.'); }
    }
  };
}
function openModulesModal(u){
  showModal(`<h3>Módulos de ${escapeHtml(u.name)}</h3><p>Marca los módulos que este colaborador puede editar. Los demás se mostrarán en modo lectura.</p><div id="mdBox">${modsChecks(u.modules)}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="mdSave">Guardar</button></div>`);
  $id('mdSave').onclick=async()=>{
    try{ await firebase.firestore().collection('usuarios').doc(u.id).update({modules:readMods($id('mdBox'))}); closeModal(); showToast('Permisos de módulos actualizados'); USERS=await loadRoster(); render(); }
    catch(e){ showToast('No se pudieron guardar los permisos.'); }
  };
}
async function userAction(act,u){
  if(!u||u.role==='admin') return;
  if(act==='mod'){ openModulesModal(u); return; }
  if(act==='reset'){
    try{ await firebase.auth().sendPasswordResetEmail(u.id); showToast('Correo de restablecimiento enviado a '+u.id); }catch(e){ showToast('No se pudo enviar el correo.'); }
    return;
  }
  if(act==='tog'){
    try{ await firebase.firestore().collection('usuarios').doc(u.id).update({active:u.active===false}); showToast(u.active===false?'Usuario activado':'Usuario desactivado'); USERS=await loadRoster(); render(); }catch(e){ showToast('No se pudo actualizar.'); }
    return;
  }
  if(act==='del'){
    showModal(`<h3>Quitar acceso</h3><p>Se quitará el acceso de <strong>${escapeHtml(u.name)}</strong> a la aplicación. Su cuenta de inicio de sesión no se elimina, pero ya no podrá entrar.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn danger" id="okDel">Quitar acceso</button></div>`);
    $id('okDel').onclick=async()=>{
      try{ await firebase.firestore().collection('usuarios').doc(u.id).delete(); closeModal(); showToast('Acceso retirado'); USERS=await loadRoster(); render(); }catch(e){ showToast('No se pudo quitar el acceso.'); }
    };
  }
}

startAuth();
